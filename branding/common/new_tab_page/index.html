<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="customize-toggle" class="customize-toggle" type="button" aria-label="Customize new tab" aria-expanded="false" aria-controls="customize-panel" title="Customize new tab">
        <span aria-hidden="true">&#9881;</span>
    </button>

    <aside id="customize-panel" class="customize-panel" aria-labelledby="customize-title" hidden>
        <div class="customize-heading">
            <h2 id="customize-title">Make this tab yours</h2>
            <button id="customize-close" class="icon-button" type="button" aria-label="Close customization">&times;</button>
        </div>

        <fieldset>
            <legend>Background</legend>
            <div class="wallpaper-grid">
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="dusk" aria-pressed="true">
                    <span class="wallpaper-preview wallpaper-dusk" aria-hidden="true"></span><span>Dusk</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="aurora" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-aurora" aria-hidden="true"></span><span>Aurora</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="ocean" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-ocean" aria-hidden="true"></span><span>Ocean</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="grove" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-grove" aria-hidden="true"></span><span>Grove</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="ember" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-ember" aria-hidden="true"></span><span>Ember</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="rose" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-rose" aria-hidden="true"></span><span>Rose</span>
                </button>
                <button class="wallpaper-choice" type="button" data-wallpaper-choice="stone" aria-pressed="false">
                    <span class="wallpaper-preview wallpaper-stone" aria-hidden="true"></span><span>Stone</span>
                </button>
            </div>
            <div class="background-upload-row">
                <label class="upload-button" for="custom-background-file">Upload a photo</label>
                <input id="custom-background-file" class="file-input-hidden" type="file" accept="image/jpeg,image/png,image/webp">
                <button id="remove-custom-background" class="clear-background" type="button" hidden>Remove photo</button>
                <small id="background-status" aria-live="polite">Saved only in this browser profile</small>
            </div>
        </fieldset>

        <fieldset>
            <legend>Accent</legend>
            <div class="accent-choices" role="group" aria-label="Accent color">
                <button class="accent-choice accent-blue" type="button" data-accent-choice="blue" aria-label="Blue accent" aria-pressed="true"></button>
                <button class="accent-choice accent-violet" type="button" data-accent-choice="violet" aria-label="Violet accent" aria-pressed="false"></button>
                <button class="accent-choice accent-cyan" type="button" data-accent-choice="cyan" aria-label="Cyan accent" aria-pressed="false"></button>
                <button class="accent-choice accent-mint" type="button" data-accent-choice="mint" aria-label="Mint accent" aria-pressed="false"></button>
                <button class="accent-choice accent-coral" type="button" data-accent-choice="coral" aria-label="Coral accent" aria-pressed="false"></button>
            </div>
        </fieldset>

        <fieldset>
            <legend>Show on new tabs</legend>
            <label class="visibility-option"><span>Greeting</span><input type="checkbox" data-visibility="greeting" checked></label>
            <label class="visibility-option"><span>Clock</span><input type="checkbox" data-visibility="clock" checked></label>
            <label class="visibility-option"><span>Weather widget</span><input type="checkbox" data-visibility="weather" checked></label>
        </fieldset>
    </aside>

    <div class="ntp-container">
        <h1 id="greeting">Good afternoon</h1>
        <div id="clock">12:00 PM</div>

        <!-- Search Bar with Dynamic Engine Selector -->
        <div class="search-box-wrapper">
            <select id="engine-selector" aria-label="Choose a search engine">
                <option value="" selected disabled>Choose engine</option>
                <option value="ddg">DuckDuckGo</option>
                <option value="brave">Brave Search</option>
                <option value="google">Google</option>
            </select>
            <input type="text" id="search-input" placeholder="Choose an engine to search..." aria-label="Search or enter a web address" autofocus>
        </div>

        <section class="newtab-section" id="bookmarks-section" aria-labelledby="bookmarks-title">
            <h2 id="bookmarks-title">Bookmarks</h2>
            <div id="bookmark-grid" class="bookmark-grid"></div>
            <p id="bookmarks-empty" class="bookmarks-empty" hidden>No bookmarks yet. Add some with the bookmark star.</p>
        </section>

        <!-- Weather widget -->
        <div class="weather-badge" id="weather-card">
            <span class="temp" id="weather-temp">--°C</span>
            <div class="weather-meta">
                <span class="condition" id="weather-cond">Loading...</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
