name: Build Whister Browser

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Chromium channel to build
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.channel }}
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP\depot_tools"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\depot_tools"

      - name: Free runner disk space
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\hostedtoolcache\windows\Java',
            'C:\hostedtoolcache\windows\dotnet'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C

      - name: Fetch Chromium source
        shell: pwsh
        working-directory: C:\
        run: |
          if (-not (Test-Path C:\chromium\src)) {
            New-Item -ItemType Directory -Path C:\chromium | Out-Null
            Set-Location C:\chromium
            fetch --no-history chromium
          }

      - name: Run Whister build
        shell: pwsh
        run: .\update_and_build.ps1 -Channel "${{ inputs.channel }}"

      - name: Install release packaging dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package Whister installer
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $buildDirectory = if ("${{ inputs.channel }}" -eq "stable") {
            "C:\chromium\src\out\StableRelease"
          } else {
            "C:\chromium\src\out\BetaRelease"
          }
          .\package_installer.ps1 -BuildDir $buildDirectory

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: whister-${{ inputs.channel }}-installer
          path: |
            dist\WhisterSetup-*.exe
            dist\WhisterSetup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
